spring:
  flyway:
    baseline-on-migrate: true   # 로컬 기존 스키마 위에서 Flyway 시작 허용
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5433/cloumy}
    username: ${POSTGRES_USER:cloumy}
