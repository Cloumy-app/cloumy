# 로컬 개발 시 환경변수 없이도 기동 가능하도록 기본값 설정
app:
  jwt:
    secret: ${JWT_SECRET:7dee9656c691276ae9037faeafec4871f3eb93d6ba4a79488f574ad56e2ede47}
    access-ttl: ${JWT_ACCESS_TTL:3600}
    refresh-ttl: ${JWT_REFRESH_TTL:1209600}
  internal-api-key: ${INTERNAL_API_KEY:0cb53508753c3eab4f9c48b4b4c464f356c05360494cc628fdef039172eaefab}

logging:
  level:
    com.cloumy: DEBUG
