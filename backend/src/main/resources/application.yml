server:
  port: 8080

spring:
  application:
    name: cloumy-backend
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.UserDetailsServiceAutoConfiguration
  datasource:
    url: ${POSTGRES_JDBC_URL:jdbc:postgresql://localhost:5432/cloumy}
    username: ${POSTGRES_USER:cloumy}
    password: ${POSTGRES_PASSWORD:cloumy}
    driver-class-name: org.postgresql.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
        jdbc:
          batch_size: 50
        order_inserts: true
        order_updates: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      # Lettuce 기본 커맨드 타임아웃은 60초다. Redis가 죽으면 JwtTokenProvider·RateLimitFilter의
      # fail-open이 그 60초를 다 기다린 뒤에야 통과해서, 결국 모든 인증 요청이 1분씩 매달린다
      # (2026-08-26 실측: 60.14초). fail-open을 fail-open답게 만들려면 이 값이 필요하다.
      # Redis는 같은 네트워크에 있어 정상 응답은 수 ms다 — 1초면 충분히 여유롭다.
      timeout: 1s
      connect-timeout: 1s
  jackson:
    default-property-inclusion: non_null
    time-zone: Asia/Seoul
    serialization:
      write-dates-as-timestamps: false

management:
  endpoints:
    web:
      exposure:
        include: health, info
  endpoint:
    health:
      show-details: never

app:
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: ${JWT_ACCESS_TTL:3600}
    refresh-ttl: ${JWT_REFRESH_TTL:1209600}
  oauth:
    kakao:
      client-id: ${KAKAO_CLIENT_ID:}
      client-secret: ${KAKAO_CLIENT_SECRET:}
      redirect-uri: ${KAKAO_REDIRECT_URI:http://localhost:8080/auth/callback/kakao}
    google:
      client-id: ${GOOGLE_CLIENT_ID:}
      client-secret: ${GOOGLE_CLIENT_SECRET:}
      redirect-uri: ${GOOGLE_REDIRECT_URI:http://localhost:8080/auth/callback/google}
    naver:
      client-id: ${NAVER_CLIENT_ID:}
      client-secret: ${NAVER_CLIENT_SECRET:}
      redirect-uri: ${NAVER_REDIRECT_URI:http://localhost:8080/auth/callback/naver}
  kakao:
    # KAKAO_CLIENT_ID와 동일한 앱의 REST API 키 — Kakao Local API(숙소 검색/역지오코딩)
    rest-api-key: ${KAKAO_REST_API_KEY:}
  fastapi:
    url: ${FASTAPI_URL:http://localhost:8000}
  internal-api-key: ${INTERNAL_API_KEY}
