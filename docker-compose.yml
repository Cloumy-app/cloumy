# 로컬 개발 전용 — DB + Redis + Spring + FastAPI 전체 스택
# 빠른 개발 시: docker compose up -d postgres redis 후 앱은 직접 실행
services:
  spring:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    environment:
      POSTGRES_JDBC_URL: jdbc:postgresql://postgres:5432/cloumy
      REDIS_HOST: redis
      REDIS_PORT: 6379
      FASTAPI_URL: http://fastapi:8000
      SPRING_PROFILES_ACTIVE: dev
      SPRING_FLYWAY_BASELINE_ON_MIGRATE: "true"
      # V5가 최신이던 시절의 잔재. 평소엔 무해하다 — Flyway는 db/init.sql이 만든
      # spatial_ref_sys를 무시하고 빈 스키마로 보므로 baseline 자체가 발동하지 않는다(2026-08-01 실측).
      # 다만 스키마에 진짜 테이블이 남은 상태로 붙으면 baseline이 발동해 V1~V5가 스킵되므로 0이 안전하다.
      SPRING_FLYWAY_BASELINE_VERSION: "0"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      fastapi:
        condition: service_started
    restart: unless-stopped
    networks:
      - cloumy-network

  fastapi:
    build:
      context: ./ai
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    env_file: ai/.env
    environment:
      POSTGRES_URL: postgresql+asyncpg://cloumy:${POSTGRES_PASSWORD:-password}@postgres:5432/cloumy
      REDIS_URL: redis://redis:6379/0
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - cloumy-network

  postgres:
    build:
      context: ./db
      dockerfile: Dockerfile
    ports:
      - "5433:5432"
    environment:
      POSTGRES_DB: cloumy
      POSTGRES_USER: cloumy
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cloumy"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - cloumy-network

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    networks:
      - cloumy-network

volumes:
  postgres_data:

networks:
  cloumy-network:
    driver: bridge
