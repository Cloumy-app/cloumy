name: Deploy

on:
  push:
    branches: [main]

env:
  REGISTRY: ghcr.io
  BACKEND_IMAGE: ghcr.io/cloumy-app/cloumy-backend
  AI_IMAGE: ghcr.io/cloumy-app/cloumy-ai

jobs:
  build-and-push:
    name: Docker 빌드 & GHCR 푸시
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: GHCR 로그인
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Docker Buildx 설정
        uses: docker/setup-buildx-action@v3

      - name: backend 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ env.BACKEND_IMAGE }}:${{ github.sha }}
            ${{ env.BACKEND_IMAGE }}:latest
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: ai 이미지 빌드 & 푸시
        uses: docker/build-push-action@v5
        with:
          context: ./ai
          push: true
          tags: |
            ${{ env.AI_IMAGE }}:${{ github.sha }}
            ${{ env.AI_IMAGE }}:latest
          cache-from: type=gha,scope=ai
          cache-to: type=gha,mode=max,scope=ai

  deploy:
    name: EC2 배포
    runs-on: ubuntu-latest
    needs: build-and-push

    steps:
      - name: EC2 SSH 배포
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ubuntu
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            cd ~/cloumy
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d
            docker image prune -f
